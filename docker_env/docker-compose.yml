name: lineage-${BUILD_PROFILE:-pixel}
services:
  lineage-builder:
    platform: linux/amd64
    command: ["${BUILD_ACTION:-all}"]
    build:
      context: ..
      dockerfile: docker_env/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: lineage-builder:ubuntu22.04-${HOST_UID:-1000}-${HOST_GID:-1000}
    init: true
    restart: "no"
    environment:
      BUILD_PROFILE: ${BUILD_PROFILE:-pixel}
      JOBS: ${JOBS:-}
      SYNC_JOBS: ${SYNC_JOBS:-4}
      SYNC_RETRIES: ${SYNC_RETRIES:-3}
      SYNC_RETRY_DELAY: ${SYNC_RETRY_DELAY:-15}
      MIN_FREE_GB: ${MIN_FREE_GB:-}
      BUILD_MIN_FREE_GB: ${BUILD_MIN_FREE_GB:-150}
      DISK_RESERVE_GB: ${DISK_RESERVE_GB:-5}
      SYNC_IDLE_SECONDS: ${SYNC_IDLE_SECONDS:-600}
      SYNC_MAX_SECONDS: ${SYNC_MAX_SECONDS:-43200}
      WATCHDOG_INTERVAL: ${WATCHDOG_INTERVAL:-30}
      BUILD_IDLE_SECONDS: ${BUILD_IDLE_SECONDS:-1800}
      BUILD_MAX_SECONDS: ${BUILD_MAX_SECONDS:-172800}
    volumes:
      - ../android/${BUILD_PROFILE:-pixel}:/android/lineage
      - ../docker_source/${BUILD_PROFILE:-pixel}/zips:/android/zips
      - ../docker_source/${BUILD_PROFILE:-pixel}/logs:/android/logs
    stop_grace_period: 2m
