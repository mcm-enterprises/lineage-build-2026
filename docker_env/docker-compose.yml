version: '3.8'

services:
  lineage-builder:
    build: .
    image: lineage-builder:latest
    container_name: lineage-builder-husky
    restart: "no"

    # Environment Configuration
    environment:
      - DEVICE=husky
      - BRANCH=lineage-23.0
      - USE_CCACHE=1
      - CCACHE_SIZE=50G

    # Volumes (Persist Data)
    volumes:
      # Source Code (The 150GB monster)
      - ../docker_source/lineage:/android/lineage

      # Output Zips
      - ../docker_source/zips:/android/zips

      # Cache (Speed up rebuilds)
      - ../docker_source/ccache:/srv/ccache

    # Resource Limits (Prevents freezing your PC)
    deploy:
      resources:
        limits:
          memory: 24G

    # Networking
    # Host networking is slightly faster for thousands of connections
    network_mode: "host"
