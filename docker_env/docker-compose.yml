services:
  lineage-builder:
    build:
      context: ..
      dockerfile: docker_env/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: lineage-builder:22.1
    init: true
    restart: "no"
    environment:
      BRANCH: lineage-22.1
      JOBS: ${JOBS:-}
      SYNC_JOBS: ${SYNC_JOBS:-4}
      SYNC_RETRIES: ${SYNC_RETRIES:-3}
      MIN_FREE_GB: ${MIN_FREE_GB:-300}
    volumes:
      - ../docker_source/lineage:/android/lineage
      - ../docker_source/zips:/android/zips
      - ../docker_source/logs:/android/logs
    stop_grace_period: 2m
