name: lineage-${BUILD_PROFILE:-pixel}
services:
  lineage-builder:
    build:
      context: ..
      dockerfile: docker_env/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: lineage-builder:ubuntu22.04-${HOST_UID:-1000}-${HOST_GID:-1000}
    init: true
    restart: "no"
    environment:
      BUILD_PROFILE: ${BUILD_PROFILE:-pixel}
      JOBS: ${JOBS:-}
      SYNC_JOBS: ${SYNC_JOBS:-4}
      SYNC_RETRIES: ${SYNC_RETRIES:-3}
      MIN_FREE_GB: ${MIN_FREE_GB:-300}
    volumes:
      - ../docker_source/${BUILD_PROFILE:-pixel}/lineage:/android/lineage
      - ../docker_source/${BUILD_PROFILE:-pixel}/zips:/android/zips
      - ../docker_source/${BUILD_PROFILE:-pixel}/logs:/android/logs
    stop_grace_period: 2m
