name: Validate build automation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax and offline integration tests
        run: |
          bash -n build-lineage.sh bootstrap_docker.sh setup_build_env.sh docker_env/src/entrypoint.sh
          python3 -m unittest discover -s tests -v
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('local_manifests/husky.xml')"
          docker compose -f docker_env/docker-compose.yml config --quiet
      - name: Build supported Ubuntu environment
        run: docker build -f docker_env/Dockerfile -t lineage-build-smoke .
      - name: Check container tools and user
        run: |
          docker run --rm --entrypoint bash lineage-build-smoke -c 'test "$(id -u)" -ne 0 && repo --version && git lfs version && command -v rsync flock python3'
          docker run --rm lineage-build-smoke --help
